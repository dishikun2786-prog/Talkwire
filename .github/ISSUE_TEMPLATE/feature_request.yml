name: 功能建议
description: 想要的能力、想改的接口
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你在做什么、现在卡在哪里。先说问题，再说方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 设想的做法
      description: 涉及协议的，写清要加或改的帧；涉及宿主的，写清宿主要多实现什么。
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法
